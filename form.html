<!DOCTYPE html>
<html>
  <head>
    <title>Library Member Profile & Registration</title>
    <link rel="icon" href="favicon.png" />
  </head>
  <body>
    <h1>Library Member Profile</h1>

    <p>Welcome to the library member portal.</p>

    <p><b><i>Library membership details</i></b></p>

    <div>This is a block element</div>
    <span>This is an inline element</span>
    <br /><br />

    <a href="https://www.aiub.edu" target="_blank">Visit AIUB</a>
    <br /><br />

    <table border="1">
      <tr>
        <th>Member ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Image</th>
      </tr>
      <tr>
        <td>101</td>
        <td>John Doe</td>
        <td>john@aiub.edu</td>
        <td>
          <img src="https://fastly.picsum.photos/id/13/2500/1667.jpg?hmac=SoX9UoHhN8HyklRA4A3vcCWJMVtiBXUg0W4ljWTor7s" width="100" height="60" alt="Member Image" />
        </td>
      </tr>
    </table>

    <br />

    <h2>Membership Registration Form</h2>
    <form action="" method="get">
      <table>
        <tr>
          <td><label for="name">Name</label></td>
          <td><input type="text" id="name" name="name" required /></td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td><input type="email" id="email" name="email" required /></td>
        </tr>
        <tr>
          <td><label for="password">Password</label></td>
          <td><input type="password" id="password" name="password" required /></td>
        </tr>
        <tr>
          <td><label for="age">Age</label></td>
          <td><input type="number" id="age" name="age" /></td>
        </tr>
        <tr>
          <td><label for="dob">DOB</label></td>
          <td><input type="date" id="dob" name="dob" /></td>
        </tr>
        <tr>
          <td>Gender</td>
          <td>
            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>
          </td>
        </tr>
        <tr>
          <td><label for="mtype">Membership Type</label></td>
          <td>
            <select id="mtype" name="mtype">
              <option value="regular">Regular</option>
              <option value="premium">Premium</option>
            </select>
          </td>
